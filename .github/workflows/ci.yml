name: Validate FindCare

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Create the project environment and install pinned dependencies
        run: make setup
      - name: Run tests and JavaScript syntax check
        run: make test
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsht
      - name: Validate launcher syntax
        run: |
          bash -n run.sh scripts/setup-python.sh start.sh
          zsh -n start.command
      - name: Build and verify release checksum
        run: |
          make dist
          cd dist
          sha256sum -c findcare-search-portable-v$(cat ../VERSION).zip.sha256
